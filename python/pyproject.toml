[project]
name = "lampforge"
version = "0.1.0"
description = "Canonical Pydantic domain model for LAMPForge, projected into OpenAPI, JSON Schema, an MCP tool surface and a seed."
readme = "README.md"
requires-python = ">=3.11"

# Pins matter here. The MCP tool surface is generated from these exact
# libraries, and the FastMCP API this server targets lives in the 1.x line:
# mcp 2.0.0 relocated `mcp.server.fastmcp`, so it is explicitly excluded.
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "mcp[cli]>=1.29,<2",
    "uvicorn>=0.30",
]

[project.scripts]
lampforge-mcp = "lampforge.mcp_server:main"
lampforge-generate = "lampforge.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lampforge"]
